<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Modal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap">

<body>
<div class="pl-backdrop"><div class="pl-modal pl-modal--small" role="dialog" aria-label="Delete reward?">
<div class="pl-modal__head"><h2 class="pl-heading-md">Delete reward?</h2><button class="pl-btn pl-btn--tertiary pl-btn--icon-only" aria-label="Close"><span class="pl-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M13.97 15.03a.75.75 0 1 0 1.06-1.06l-3.97-3.97 3.97-3.97a.75.75 0 0 0-1.06-1.06l-3.97 3.97-3.97-3.97a.75.75 0 0 0-1.06 1.06l3.97 3.97-3.97 3.97a.75.75 0 1 0 1.06 1.06l3.97-3.97 3.97 3.97Z"/></svg></span></button></div>
<div class="pl-modal__body"><p>Customers who haven’t redeemed “10% off” will lose access to it. This can’t be undone.</p></div>
<div class="pl-modal__foot"><button class="pl-btn">Cancel</button><button class="pl-btn pl-btn--primary pl-btn--critical">Delete reward</button></div>
</div></div>
</body>
