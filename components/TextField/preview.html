<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TextField</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap">
</head>
<body>
<div class="pl-pad pl-col-tight" style="max-width:420px">
<div class="pl-field"><label class="pl-label">Store name</label><div class="pl-input"><input value="Linen &amp; Co"></div><p class="pl-help">Appears in emails and on your storefront.</p></div>
<div class="pl-field"><label class="pl-label pl-label--required">Discount</label><div class="pl-input pl-input--focus"><input value="15"><span class="pl-input__suffix">%</span></div></div>
<div class="pl-field"><label class="pl-label">Email</label><div class="pl-input pl-input--error"><input value="hello@"></div><div class="pl-error"><span class="pl-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M10 6a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5a.75.75 0 0 1 .75-.75Z"/><path d="M11 13a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"/><path fill-rule="evenodd" d="M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Zm-1.5 0a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0Z"/></svg></span><span>Enter a valid email address</span></div></div>
</div>
</body>
</html>
