<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Badge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap">
</head>
<body>
<div class="pl-pad pl-col-tight">
<div class="pl-row">
<span class="pl-badge">Draft</span>
<span class="pl-badge pl-badge--info">Scheduled</span>
<span class="pl-badge pl-badge--success">Active</span>
<span class="pl-badge pl-badge--caution">Unfulfilled</span>
<span class="pl-badge pl-badge--warning">Payment pending</span>
<span class="pl-badge pl-badge--critical">Failed</span>
</div>
<div class="pl-row">
<span class="pl-badge pl-badge--success pl-badge--strong">Paid</span>
<span class="pl-badge pl-badge--critical pl-badge--strong">Action required</span>
<span class="pl-badge pl-badge--success pl-badge--large"><span class="pl-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M13.28 9.03a.75.75 0 0 0-1.06-1.06l-2.97 2.97-1.22-1.22a.75.75 0 0 0-1.06 1.06l1.75 1.75a.75.75 0 0 0 1.06 0l3.5-3.5Z"/><path fill-rule="evenodd" d="M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Zm-1.5 0a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0Z"/></svg></span>Enabled</span>
<span class="pl-badge pl-badge--warning pl-badge--large">Partially refunded</span>
</div>
</div>
</body>
</html>
