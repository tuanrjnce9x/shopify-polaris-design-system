<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toast</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap">
<style>.pl-toast .pl-btn--tertiary:hover{background:var(--p-color-bg-fill-inverse-hover)}</style>
</head>
<body>
<div class="pl-pad pl-col-tight" style="align-items:flex-start">
<div class="pl-toast" role="status"><span>Settings saved</span><button class="pl-btn pl-btn--tertiary pl-btn--icon-only" aria-label="Dismiss" style="margin:-4px"><span class="pl-icon pl-icon--inverse" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M13.97 15.03a.75.75 0 1 0 1.06-1.06l-3.97-3.97 3.97-3.97a.75.75 0 0 0-1.06-1.06l-3.97 3.97-3.97-3.97a.75.75 0 0 0-1.06 1.06l3.97 3.97-3.97 3.97a.75.75 0 1 0 1.06 1.06l3.97-3.97 3.97 3.97Z"/></svg></span></button></div>
<div class="pl-toast pl-toast--error" role="alert"><span>Couldn’t save settings</span><span class="pl-toast__action">Retry</span></div>
</div>
</body>
</html>
